[General]
# Replace OWNER and COMMIT in this URL after publishing the repository.
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/OWNER/openclash-two-subscriptions/COMMIT/config/openclash-base.yaml, path=/etc/openclash/config/openclash-base.yaml, force=true
CONFIG_FILE = /etc/openclash/config/openclash-base.yaml
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "cheap" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "premium_ai" "['url']" "$EN_KEY2"
