[General]
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/2252031668/openclash-two-subscriptions/e7a105b1cbb1156d19b2a5dc42c39a583dab1cc3/config/openclash-base.yaml, path=/etc/openclash/config/openclash-base.yaml, force=true
