[General]
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/2252031668/openclash-two-subscriptions/88b5a56dd7a464f974faaa96c773eb3e19425104/config/openclash-base.yaml, path=/etc/openclash/config/openclash-base.yaml, force=true
CONFIG_FILE = /etc/openclash/config/openclash-base.yaml
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "cheap" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "premium_ai" "['url']" "$EN_KEY2"
