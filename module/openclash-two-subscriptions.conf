[General]
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/2252031668/openclash-two-subscriptions/01c3a745ec07ae08e58ec0d7ded4d6e698d4824d/config/openclash-base.yaml, path=/etc/openclash/config/openclash-base.yaml, force=true
CONFIG_FILE = /etc/openclash/config/openclash-base.yaml
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "cheap" "['url']" "$EN_KEY1"
