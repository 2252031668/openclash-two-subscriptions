[General]
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/2252031668/openclash-two-subscriptions/d5f473c9b4cd2d0750f7f27f88c5ccf98c0ec5b7/config/openclash-base.yaml, path=/etc/openclash/config/openclash-base.yaml, force=true
CONFIG_FILE = /etc/openclash/config/openclash-base.yaml
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "cheap" "['url']" "$EN_KEY1"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "premium_ai" "['url']" "$EN_KEY2"
